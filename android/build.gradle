buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Workaround for Gradle 9 + CMake on Windows: "libc++_shared.so: not a regular file"
subprojects { sub ->
    if (sub != sub.rootProject && !sub.state.executed) {
        sub.afterEvaluate {
            ["mergeDebugNativeLibs", "mergeReleaseNativeLibs"].each { name ->
                def t = sub.tasks.findByName(name)
                if (t != null) t.doNotTrackState("CMake/native lib paths can be non-regular on Windows (Gradle 9 compatibility)")
            }
        }
    }
    sub.tasks.whenTaskAdded { task ->
        if (task.name.startsWith("buildCMake") || task.name == "mergeDebugNativeLibs" || task.name == "mergeReleaseNativeLibs") {
            task.doNotTrackState("CMake/native lib paths can be non-regular on Windows (Gradle 9 compatibility)")
        }
    }
}
